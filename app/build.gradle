plugins {
    alias(libs.plugins.androidLibrary)  // Just change this one line
    alias(libs.plugins.jetbrainsKotlinAndroid)
    id 'maven-publish'  // Only add this line
}

android {
    namespace 'eyevinn.com.client.sdk.android'
    compileSdk 35

    defaultConfig {
        // Remove applicationId for library
        minSdk 34
        targetSdk 35

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        vectorDrawables {
            useSupportLibrary true
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
    kotlinOptions {
        jvmTarget = '1.8'
    }
    buildFeatures {
        compose true
    }
    composeOptions {
        kotlinCompilerExtensionVersion '1.5.10'
    }
    packaging {
        resources {
            excludes += '/META-INF/{AL2.0,LGPL2.1}'
        }
    }
}

// JitPack publishing configuration - ONLY ADD THIS BLOCK
afterEvaluate {
    publishing {
        publications {
            release(MavenPublication) {
                from components.release  // This works for libraries
                groupId = 'com.github.Eyevinn'
                artifactId = 'player-analytics-client-sdk-android'
                version = '1.0.0'
            }
        }
    }
}

dependencies {
    implementation libs.androidx.media3.session
    implementation libs.androidx.media3.exoplayer
    implementation libs.androidx.media3.ui
    implementation libs.androidx.media3.exoplayer.hls

    implementation libs.androidx.core.ktx
    implementation libs.androidx.lifecycle.runtime.ktx
    implementation libs.androidx.activity.compose
    implementation platform(libs.androidx.compose.bom)
    implementation libs.androidx.ui
    implementation libs.androidx.ui.graphics
    implementation libs.androidx.ui.tooling.preview
    implementation libs.androidx.material3
    implementation libs.androidx.media3.ui
    implementation libs.play.services.ads
    implementation libs.media3.exoplayer.hls
    implementation libs.retrofit
    implementation libs.converter.gson

    implementation "androidx.media3:media3-exoplayer:1.4.1"
    implementation "androidx.media3:media3-exoplayer-hls:1.4.1"
    implementation "androidx.media3:media3-exoplayer-dash:1.4.1"
    implementation "androidx.media3:media3-datasource-okhttp:1.4.1"
    implementation libs.interactivemedia

    testImplementation libs.junit
    androidTestImplementation libs.androidx.junit
    androidTestImplementation libs.androidx.espresso.core
    androidTestImplementation platform(libs.androidx.compose.bom)
    androidTestImplementation libs.androidx.ui.test.junit4
    debugImplementation libs.androidx.ui.tooling
    debugImplementation libs.androidx.ui.test.manifest
}