plugins {
    alias(libs.plugins.androidLibrary)  // Just change this one line
    alias(libs.plugins.jetbrainsKotlinAndroid)
    id 'maven-publish'  // Only add this line
}

android {
    namespace 'eyevinn.com.client.sdk.android'
    compileSdk 35

    defaultConfig {
        // Remove applicationId for library
        minSdk 34
        targetSdk 35

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
    kotlinOptions {
        jvmTarget = '1.8'
    }
    packaging {
        resources {
            excludes += '/META-INF/{AL2.0,LGPL2.1}'
        }
    }
}

// JitPack publishing configuration - ONLY ADD THIS BLOCK
afterEvaluate {
    publishing {
        publications {
            release(MavenPublication) {
                from components.release  // This works for libraries
                groupId = 'com.github.Eyevinn'
                artifactId = 'player-analytics-client-sdk-android'
                version = '1.0.0'
            }
        }
    }
}

dependencies {
    // Only what the SDK code (com.analytics.sdk) uses. The sample player and its UI, Ads and
    // Compose dependencies live in the :sample module (#21).
    implementation libs.androidx.media3.exoplayer
    implementation libs.androidx.media3.exoplayer.hls
    implementation libs.androidx.core.ktx
    implementation libs.androidx.lifecycle.runtime.ktx
    implementation libs.retrofit
    implementation libs.converter.gson

    implementation "androidx.media3:media3-exoplayer:1.4.1"
    implementation "androidx.media3:media3-exoplayer-hls:1.4.1"

    testImplementation libs.junit
}